services:
  app:
    build: .
    ports: ["127.0.0.1:5080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PublicUrl: http://localhost:5080
      Demo__Enabled: "true"
      Demo__Password: ${DEMO_PASSWORD:?Copy .env.example to .env first}
      Email__Mode: smtp
      Email__Host: mailpit
      Email__Port: "1025"
      Email__EnableSsl: "false"
    volumes: ["orencode-data:/data"]
    depends_on: [mailpit]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped
volumes:
  orencode-data:
